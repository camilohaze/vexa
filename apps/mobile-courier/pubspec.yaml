name: mobile_courier
description: Vexa courier (repartidor) mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  geolocator: ^13.0.2
  flutter_foreground_task: ^8.17.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_secure_storage: ^9.2.2
